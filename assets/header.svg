<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="t d">
  <title id="t">Ayanbergen Saduakassov</title>
  <desc id="d">AI engineer building LLM agents, RAG, text-to-SQL and BIM tooling</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0c2233"/>
      <stop offset="1" stop-color="#0b3b3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:700 46px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f8fafc;letter-spacing:-1px}
    .role{font:500 22px ui-monospace,'SF Mono',Menlo,Consolas,monospace;fill:url(#accent);opacity:0}
    .meta{font:400 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#94a3b8;letter-spacing:.4px}
    .r1{animation:cycle 16s infinite 0s}
    .r2{animation:cycle 16s infinite 4s}
    .r3{animation:cycle 16s infinite 8s}
    .r4{animation:cycle 16s infinite 12s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}26%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
    .drift{animation:drift 22s linear infinite}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-120px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-in-out infinite}
    .p2{animation-delay:.8s}.p3{animation-delay:1.6s}.p4{animation-delay:2.4s}
    @keyframes pulse{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .wave1{animation:wave 14s linear infinite}
    .wave2{animation:wave 22s linear infinite reverse}
    @keyframes wave{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.r1{opacity:1}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="1200" height="280" fill="url(#grid)"/>
    <g class="drift" opacity="0.9">
      <g fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.2">
        <path d="M760 70L880 120L1010 60L1130 130L1250 80L1370 140"/>
        <path d="M880 120L930 215L1060 190L1130 130"/>
        <path d="M1010 60L1060 190"/>
      </g>
      <g fill="#34d399">
        <circle class="pulse" cx="760" cy="70" r="4"/>
        <circle class="pulse p2" cx="880" cy="120" r="5"/>
        <circle class="pulse p3" cx="1010" cy="60" r="4"/>
        <circle class="pulse p4" cx="1130" cy="130" r="5"/>
        <circle class="pulse p2" cx="930" cy="215" r="4"/>
        <circle class="pulse" cx="1060" cy="190" r="4"/>
      </g>
    </g>
    <g class="wave2" opacity="0.35">
      <path d="M0 250 Q150 220 300 250 T600 250 T900 250 T1200 250 T1500 250 T1800 250 V280 H0Z" fill="#38bdf8" fill-opacity="0.18"/>
    </g>
    <g class="wave1" opacity="0.5">
      <path d="M0 262 Q150 236 300 262 T600 262 T900 262 T1200 262 T1500 262 T1800 262 V280 H0Z" fill="#34d399" fill-opacity="0.22"/>
    </g>
    <rect x="64" y="64" width="64" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="name" x="64" y="132">Ayanbergen Saduakassov</text>
    <g transform="translate(64 176)">
      <text class="role r1">AI engineer: LLM agents, RAG, text-to-SQL</text>
      <text class="role r2">Evals and guardrails before features</text>
      <text class="role r3">Drawings to BIM, models you can check</text>
      <text class="role r4">Physics-informed ML for oil and gas</text>
    </g>
    <rect class="cursor" x="64" y="208" width="10" height="3" fill="#34d399"/>
    <text class="meta" x="64" y="236">Civil Engineering, Cardiff University Kazakhstan  ·  Altyn Belgi scholar  ·  Astana</text>
  </g>
</svg>
