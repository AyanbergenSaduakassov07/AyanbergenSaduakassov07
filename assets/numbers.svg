<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Key numbers">
  <style>
    .bg{fill:#0d1117}.d{stroke:#21262d;stroke-width:1}
    .n{font:700 40px 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f0f6fc;letter-spacing:-1px}
    .l{font:400 13px 'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#8b949e}
    .a{animation:i 1s ease-out both}.b{animation-delay:.15s}.c{animation-delay:.3s}.e{animation-delay:.45s}
    @keyframes i{from{opacity:0;transform:translateY(8px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect class="bg" width="1200" height="150" rx="14"/>
  <line class="d" x1="300" y1="28" x2="300" y2="122"/><line class="d" x1="600" y1="28" x2="600" y2="122"/><line class="d" x1="900" y1="28" x2="900" y2="122"/>
  <g class="a"><text class="n" x="50" y="72">37 → 99%</text><text class="l" x="50" y="98">drawing-to-BIM matching accuracy</text></g>
  <g class="a b"><text class="n" x="350" y="72">&lt; 20 s</text><text class="l" x="350" y="98">2D drawings to a checked 3D model</text></g>
  <g class="a c"><text class="n" x="650" y="72">87.3%</text><text class="l" x="650" y="98">recall@10, cited legal RAG</text></g>
  <g class="a e"><text class="n" x="950" y="72">1,260+</text><text class="l" x="950" y="98">tests behind a text-to-SQL platform</text></g>
</svg>
